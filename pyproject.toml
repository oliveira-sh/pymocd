[build-system]
requires = [
    "maturin>=1,<2",
]
build-backend = "maturin"

[project]
name = "pymocd"
version = "5.1.0"
description = "pymocd is a lib for multi-objective evolutionary community detection in complex networks. The evolutionary core is written in Rust and exposed through PyO3, giving it a large speed advantage over pure-Python implementations while staying a drop-in for the NetworkX/igraph ecosystem, making it well-suited to large-scale graphs."
requires-python = ">=3.10"
authors = [
    {name = "Guilherme O. Santos", email = "git@guiolvr.com"},
]
keywords = [
    "community-detection",
    "graph",
    "networks",
    "networkx",
    "multi-objective-optimization",
    "nsga-ii",
    "particle-swarm",
    "modularity",
    "rust",
]

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

license = {file = "LICENSE"}
readme = { file = "README.md", content-type = "text/markdown" }

[project.urls]
Documentation = "https://oliveira-sh.github.io/pymocd/"
Repository = "https://github.com/oliveira-sh/pymocd"
Issues = "https://github.com/oliveira-sh/pymocd/issues"

[tool.maturin]
module-name = "pymocd"
features = ["pyo3/extension-module"]
include = [
    { path = "pymocd.pyi", format = ["sdist", "wheel"] },
    { path = "py.typed", format = ["sdist", "wheel"] },
]
