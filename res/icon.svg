<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 500 480" width="500" height="480">
  <defs>
    <style>
      .axis   { stroke:#C7D3E6; stroke-width:6;  fill:none; stroke-linecap:round; }
      .front  { stroke:#009B3A; stroke-width:9;  fill:none; stroke-linecap:round; }
      .edge   { stroke:#009B3A; stroke-width:5;  fill:none; stroke-linecap:round; }
      .letter { fill:none; stroke-width:44; stroke-linecap:round; stroke-linejoin:round; }
      .blue   { stroke:#0B4DA2; }
      .green  { stroke:#009B3A; }
      .yellow { stroke:#FFC800; }
    </style>
  </defs>
  <g id="icon">
    <!-- objective-space axes -->
    <path class="axis" d="M70,55 V355 H405"/>
    <path class="axis" d="M60,72 L70,52 L80,72"/>
    <path class="axis" d="M388,345 L408,355 L388,365"/>

    <!-- dominated solutions -->
    <g fill="#9FB3CC" opacity="0.5">
      <circle cx="262" cy="95"  r="6"/>
      <circle cx="305" cy="130" r="7"/>
      <circle cx="345" cy="190" r="6"/>
      <circle cx="355" cy="255" r="6"/>
      <circle cx="300" cy="70"  r="5"/>
    </g>

    <!-- Pareto front -->
    <path class="front" d="M95,95 C112,240 200,322 388,340"/>
    <circle cx="95"  cy="95"  r="11" fill="#0B4DA2"/>
    <circle cx="388" cy="340" r="11" fill="#FFC800"/>

    <!-- otter, floating belly-up along the front -->
    <g id="otter" transform="translate(84,164) rotate(24)">
      <!-- tail -->
      <path d="M212,72 Q262,70 268,96 Q252,116 214,96 Z" fill="#0F3D75"/>
      <!-- hind flippers -->
      <ellipse cx="204" cy="42" rx="16" ry="9" fill="#0F3D75" transform="rotate(-30 204 42)"/>
      <ellipse cx="226" cy="52" rx="15" ry="8" fill="#0F3D75" transform="rotate(-15 226 52)"/>
      <!-- body -->
      <ellipse cx="138" cy="72" rx="88" ry="38" fill="#0F3D75"/>
      <!-- belly -->
      <ellipse cx="142" cy="60" rx="62" ry="23" fill="#F4E3C6"/>
      <!-- head -->
      <circle cx="40" cy="46" r="31" fill="#0F3D75"/>
      <!-- ears -->
      <circle cx="18" cy="24" r="7" fill="#0F3D75"/>
      <circle cx="56" cy="18" r="7" fill="#0F3D75"/>
      <!-- muzzle -->
      <ellipse cx="44" cy="56" rx="18" ry="13" fill="#F4E3C6"/>
      <!-- eyes -->
      <circle cx="28" cy="40" r="4" fill="#101820"/>
      <circle cx="52" cy="38" r="4" fill="#101820"/>
      <!-- nose -->
      <path d="M38,50 L50,49 L44,58 Z" fill="#101820"/>
      <!-- whiskers -->
      <g stroke="#101820" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <path d="M22,52 L6,50"/>
        <path d="M23,57 L8,59"/>
        <path d="M62,50 L78,47"/>
        <path d="M63,55 L79,56"/>
      </g>
      <!-- front paws holding the chosen community -->
      <path d="M112,48 Q112,20 130,14" stroke="#0F3D75" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M172,46 Q174,20 156,14" stroke="#0F3D75" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- the chosen solution: a community -->
      <g id="community">
        <path class="edge" d="M143,2 L112,-22 M143,2 L176,-24 M143,2 L143,-38 M112,-22 L143,-38 M176,-24 L143,-38"/>
        <circle cx="143" cy="2"   r="13" fill="#FFC800"/>
        <circle cx="112" cy="-22" r="9"  fill="#009B3A"/>
        <circle cx="176" cy="-24" r="9"  fill="#0B4DA2"/>
        <circle cx="143" cy="-38" r="8"  fill="#009B3A"/>
      </g>
    </g>
  </g>
</svg>
