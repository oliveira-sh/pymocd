site_name: pymocd
site_description: Multi-objective evolutionary community detection, powered by Rust
site_url: https://pymocd.guiolvr.com/
repo_url: https://github.com/oliveira-sh/pymocd
repo_name: oliveira-sh/pymocd
theme:
  name: material
  favicon: assets/icon.svg
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  requirements.txt
  __pycache__/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.docs-stub]
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            line_length: 80

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Algorithms: algorithms.md
  - Benchmarks: benchmarks.md
  - Examples:
      - Plotting communities: examples/plotting.md
      - Custom objectives: examples/custom-objectives.md
      - Pareto fronts: examples/pareto-fronts.md
  - API reference:
      - Detectors: api/detectors.md
      - Pareto fronts: api/fronts.md
      - Metrics & utilities: api/metrics.md
